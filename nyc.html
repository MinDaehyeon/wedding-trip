<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC Honeymoon Itinerary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Montserrat:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --color-midnight-ink: #202020;
      --color-cloud-canvas: #f5f5f5;
      --color-paper-white: #ffffff;
      --color-muted-ash: #333333;
      --color-ghost-border: #ececec;
      --color-electric-violet: #5757f8;

      --font-display: 'Montserrat', 'Noto Sans KR', sans-serif;
      --font-body: 'Inter', 'Noto Sans KR', sans-serif;

      --radius-default: 8px;
      --radius-pill: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-cloud-canvas);
      color: var(--color-midnight-ink);
      line-height: 1.4;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .header {
      margin-bottom: 32px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 48px;
      line-height: 0.97;
      letter-spacing: -0.96px;
      color: var(--color-midnight-ink);
    }
    .header p {
      margin-top: 12px;
      font-size: 16px;
      color: var(--color-muted-ash);
    }

    .day-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .day-tab {
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      background: var(--color-paper-white);
      color: var(--color-midnight-ink);
      border: 1px solid var(--color-ghost-border);
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .day-tab:hover {
      border-color: var(--color-electric-violet);
    }
    .day-tab.active {
      background: var(--color-electric-violet);
      color: var(--color-paper-white);
      border-color: var(--color-electric-violet);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
      align-items: start;
    }

    .schedule {
      background: var(--color-paper-white);
      border-radius: var(--radius-default);
      padding: 24px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
    }

    /* ─── 모바일 (≤ 768px) ─── */
    @media (max-width: 768px) {
      .container { padding: 16px 12px; }
      .header { margin-bottom: 16px; }
      .header h1 { font-size: 32px; letter-spacing: -0.5px; }
      .header p { font-size: 13px; margin-top: 6px; }

      .day-tabs {
        margin-bottom: 16px;
        position: sticky;
        top: 0;
        background: var(--color-cloud-canvas);
        padding: 8px 0;
        z-index: 10;
      }
      .day-tab { padding: 6px 14px; font-size: 13px; }

      .layout {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .map-container {
        position: sticky;
        top: 56px;
        padding: 8px;
      }
      #map {
        height: 38vh;
        min-height: 280px;
      }

      .schedule {
        padding: 16px;
        max-height: none;
        overflow-y: visible;
      }
      .schedule-day-title { font-size: 22px; }
      .schedule-item {
        grid-template-columns: 56px 1fr;
        gap: 12px;
        padding: 12px 0;
      }
      .schedule-item:hover {
        margin: 0;
        padding: 12px 0;
        border-radius: 0;
        background: transparent;
      }
      .schedule-item.highlight {
        margin: 0 -8px;
        padding: 12px 8px;
      }
      .schedule-content .title { font-size: 14px; }
      .schedule-content .desc { font-size: 12px; }
      .legend { font-size: 11px; gap: 12px; }
    }
    .schedule-day-title {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 26px;
      letter-spacing: -0.52px;
      margin-bottom: 4px;
    }
    .schedule-day-sub {
      font-size: 14px;
      color: var(--color-muted-ash);
      margin-bottom: 20px;
    }

    .schedule-item {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-ghost-border);
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .schedule-item:last-child { border-bottom: none; }
    .schedule-item:hover {
      background: var(--color-cloud-canvas);
      margin: 0 -12px;
      padding: 14px 12px;
      border-radius: var(--radius-default);
      border-bottom-color: transparent;
    }
    .schedule-item.highlight {
      background: rgba(87, 87, 248, 0.06);
      margin: 0 -12px;
      padding: 14px 12px;
      border-radius: var(--radius-default);
      border-bottom-color: transparent;
    }

    .schedule-time {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 14px;
      color: var(--color-electric-violet);
      letter-spacing: -0.2px;
    }
    .schedule-content .title {
      font-weight: 700;
      font-size: 15px;
      color: var(--color-midnight-ink);
      margin-bottom: 4px;
    }
    .schedule-content .desc {
      font-size: 13px;
      color: var(--color-muted-ash);
      line-height: 1.45;
    }
    .schedule-content .tag {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--color-midnight-ink);
      color: var(--color-paper-white);
      font-size: 11px;
      font-weight: 500;
    }
    .schedule-content .tag.booked {
      background: var(--color-electric-violet);
    }

    .map-container {
      background: var(--color-paper-white);
      border-radius: var(--radius-default);
      padding: 16px;
      position: sticky;
      top: 20px;
    }
    #map {
      width: 100%;
      height: calc(100vh - 240px);
      min-height: 500px;
      border-radius: var(--radius-default);
      z-index: 0;
    }

    .legend {
      margin-top: 12px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--color-muted-ash);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* custom map marker */
    .map-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-electric-violet);
      color: var(--color-paper-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      border: 2px solid var(--color-paper-white);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .map-marker.star {
      background: var(--color-midnight-ink);
    }

    .scrollbar::-webkit-scrollbar { width: 6px; }
    .scrollbar::-webkit-scrollbar-track { background: transparent; }
    .scrollbar::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>NYC Honeymoon</h1>
      <p>2026.07.13 — 07.18 · 민대현 ♥ 남화수</p>
    </div>

    <div class="day-tabs" id="dayTabs"></div>

    <div class="layout">
      <div class="schedule scrollbar" id="schedule"></div>
      <div class="map-container">
        <div id="map"></div>
        <div class="legend">
          <div class="legend-item"><span class="legend-dot" style="background:#5757f8"></span>일반 일정</div>
          <div class="legend-item"><span class="legend-dot" style="background:#202020"></span>메인 이벤트</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── 일정 데이터 ──────────────────────────
    const days = [
      {
        id: 'd13',
        label: '7/13 (월)',
        title: '도착',
        sub: 'Newark 도착 후 호텔 체크인',
        items: [
          { time: '22:30', title: 'EWR 도착', desc: '뉴어크 리버티 국제공항. 한인택시로 호텔 이동.', star: true, latlng: [40.6925, -74.1687] },
          { time: '24:00', title: '파라마운트 타임스퀘어 체크인', desc: '5박 묵을 호텔. 타임스퀘어 한복판.', latlng: [40.7589, -73.9847] },
        ]
      },
      {
        id: 'd14',
        label: '7/14 (화)',
        title: 'Midtown',
        sub: 'MoMA · Summit · 야경버스 · 230 Fifth',
        items: [
          { time: '09:30', title: 'Ess-a-Bagel', desc: '뉴욕 정통 베이글 + 크림치즈. 줄 서는 곳.', latlng: [40.7596, -73.9685] },
          { time: '10:30', title: 'MoMA', desc: '현대미술관. 반 고흐 별이 빛나는 밤, 모네 수련.', star: true, latlng: [40.7614, -73.9776] },
          { time: '13:00', title: 'Halal Guys', desc: '뉴욕 길거리 푸드트럭의 시초. 치킨 오버 라이스.', latlng: [40.7615, -73.9802] },
          { time: '14:00', title: 'Summit One Vanderbilt', desc: '거울방 전망대. 낮 자연광이 가장 예쁨.', star: true, booked: '예매필요', latlng: [40.7530, -73.9777] },
          { time: '17:00', title: '그랜드센트럴 · 브라이언트파크', desc: '천장벽화와 시계. 도서관 외관도 같이.', latlng: [40.7527, -73.9772] },
          { time: '17:30', title: 'Magnolia Bakery', desc: 'Sex and the City 컵케이크. 바닐라 푸딩 인생.', latlng: [40.7589, -73.9845] },
          { time: '18:30', title: '미드타운 저녁', desc: '가벼운 저녁 (취향대로).', latlng: [40.7580, -73.9855] },
          { time: '20:00', title: 'TopView 야경버스 (Live)', desc: '2층 오픈탑 더블데커. 브루클린 브릿지까지 1.5h.', star: true, booked: '예매필요', latlng: [40.7587, -73.9852] },
          { time: '22:00', title: '230 Fifth 루프탑', desc: '엠파이어 정면 야경 보면서 칵테일.', latlng: [40.7437, -73.9874] },
        ]
      },
      {
        id: 'd15',
        label: '7/15 (수)',
        title: 'Downtown · Lion King',
        sub: '자유의여신상 → 라이온킹 → Top of Rock 야경',
        items: [
          { time: '09:00', title: '자유의여신상 + Pedestal', desc: 'Battery Park 출발. 페디스털 215계단. 9시 슬롯 고정.', star: true, booked: '✅예매완료', latlng: [40.7036, -74.0142] },
          { time: '12:00', title: "Katz's Delicatessen", desc: '영화 해리가 샐리를 만났을때. 파스트라미 샌드위치.', latlng: [40.7223, -73.9874] },
          { time: '13:30', title: '소호 · Joe\'s Pizza', desc: '뉴욕 슬라이스 피자의 전설. $5 클래식.', latlng: [40.7305, -74.0023] },
          { time: '15:00', title: '웨스트빌리지 골목', desc: '영화 같은 캐스트아이언 건물·카페 거리.', latlng: [40.7335, -74.0027] },
          { time: '16:30', title: '첼시마켓 · 하이라인', desc: '폐선로 공중정원. 첼시마켓 푸드홀에서 한 잔.', latlng: [40.7424, -74.0061] },
          { time: '18:00', title: '호텔 복귀', desc: '옷 갈아입기, 라이온킹 준비.', latlng: [40.7589, -73.9847] },
          { time: '19:00', title: '라이온킹 @ Minskoff', desc: '메자닌 Row C 118-119 (베스트 자리).', star: true, booked: '✅예매완료', latlng: [40.7585, -73.9852] },
          { time: '22:00', title: 'Top of the Rock 야경', desc: '엠파이어 정면 야경. 라이온킹 도보 5분.', star: true, booked: '예매필요', latlng: [40.7587, -73.9787] },
        ]
      },
      {
        id: 'd16',
        label: '7/16 (목)',
        title: 'Brooklyn · 스냅',
        sub: '신혼 스냅 → Peter Luger 디너',
        items: [
          { time: '10:30', title: '호텔 근처 카페', desc: '늦은 아침. 여유롭게.', latlng: [40.7589, -73.9847] },
          { time: '11:30', title: '미드타운 · 5번가 산책', desc: '브런치 겸 5번가·록펠러 산책.', latlng: [40.7580, -73.9787] },
          { time: '14:00', title: '지하철 → DUMBO', desc: 'F호선 York St역 하차. 30분.', latlng: [40.7012, -73.9866] },
          { time: '14:30', title: 'DUMBO 도착', desc: '만하탄브릿지 인생샷 스팟 답사.', latlng: [40.7033, -73.9881] },
          { time: '17:00', title: '신혼 스냅촬영', desc: '브루클린 브릿지·만하탄브릿지·강변. 골든아워.', star: true, booked: '예매필요', latlng: [40.7024, -73.9875] },
          { time: '19:45', title: '윌리엄스버그 이동', desc: '우버 15분. DUMBO → Williamsburg.', latlng: [40.7099, -73.9627] },
          { time: '20:00', title: 'Peter Luger 디너', desc: '3대 스테이크. 현금만! 카드 X. 인생 포터하우스.', star: true, booked: '6/18 예약!', latlng: [40.7099, -73.9627] },
          { time: '22:30', title: '우버 호텔', desc: '브루클린 → 미드타운.', latlng: [40.7589, -73.9847] },
        ]
      },
      {
        id: 'd17',
        label: '7/17 (금)',
        title: 'AMNH · Yankees',
        sub: '자연사박물관 → 양키스 경기',
        items: [
          { time: '10:00', title: 'AMNH 자연사 박물관', desc: '밤박물관 영화 배경. 공룡·블루웨일·다이아.', star: true, booked: '예매필요', latlng: [40.7813, -73.9740] },
          { time: '12:30', title: 'Levain Bakery', desc: 'Upper West 쿠키 성지. 직경 10cm 두꺼운 쿠키.', latlng: [40.7790, -73.9803] },
          { time: '13:00', title: '센트럴파크 산책', desc: 'Bow Bridge, Bethesda Terrace 가볍게.', latlng: [40.7770, -73.9760] },
          { time: '14:00', title: 'Upper West 점심', desc: '캐주얼 카페에서 가볍게.', latlng: [40.7790, -73.9810] },
          { time: '15:30', title: '호텔 복귀', desc: '옷 갈아입기, 양키스 가기 전.', latlng: [40.7589, -73.9847] },
          { time: '17:30', title: '지하철 → Bronx', desc: '4호선 161 St-Yankee Stadium역. 40분.', latlng: [40.8276, -73.9259] },
          { time: '19:05', title: '양키스 경기 ⚾', desc: 'Yankee Stadium. 핫도그·맥주 안에서.', star: true, booked: '✅티켓보유', latlng: [40.8296, -73.9262] },
          { time: '22:30', title: '우버 호텔', desc: 'Bronx → 미드타운.', latlng: [40.7589, -73.9847] },
        ]
      },
      {
        id: 'd18',
        label: '7/18 (토)',
        title: '칸쿤 출국',
        sub: 'JFK → Cancun',
        items: [
          { time: '05:30', title: '기상', desc: '짐은 전날 밤 정리 완료.', latlng: [40.7589, -73.9847] },
          { time: '06:30', title: '호텔 출발 → JFK', desc: '한인택시 예약 권장. 새벽 surge 회피.', latlng: [40.7589, -73.9847] },
          { time: '07:20', title: 'JFK Terminal 5 도착', desc: 'JetBlue 카운터. 보안검색.', star: true, latlng: [40.6446, -73.7858] },
          { time: '09:59', title: 'JetBlue B61851 칸쿤행', desc: '약 4시간. 13:05 칸쿤 도착.', star: true, latlng: [40.6446, -73.7858] },
        ]
      }
    ];

    // ── 렌더링 ──────────────────────────
    const tabsEl = document.getElementById('dayTabs');
    const scheduleEl = document.getElementById('schedule');
    let activeDay = 'd14';
    let map, markersLayer;

    function renderTabs() {
      tabsEl.innerHTML = '';
      days.forEach(d => {
        const btn = document.createElement('button');
        btn.className = 'day-tab' + (d.id === activeDay ? ' active' : '');
        btn.textContent = d.label;
        btn.onclick = () => { activeDay = d.id; render(); };
        tabsEl.appendChild(btn);
      });
    }

    function renderSchedule() {
      const day = days.find(d => d.id === activeDay);
      scheduleEl.innerHTML = `
        <div class="schedule-day-title">${day.title}</div>
        <div class="schedule-day-sub">${day.label} · ${day.sub}</div>
      `;
      day.items.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'schedule-item' + (item.star ? ' highlight' : '');
        div.innerHTML = `
          <div class="schedule-time">${item.time}</div>
          <div class="schedule-content">
            <div class="title">${item.title}</div>
            <div class="desc">${item.desc}</div>
            ${item.booked ? `<span class="tag ${item.booked.includes('✅') ? 'booked' : ''}">${item.booked}</span>` : ''}
          </div>
        `;
        div.onclick = () => focusMarker(idx);
        scheduleEl.appendChild(div);
      });
    }

    function initMap() {
      map = L.map('map').setView([40.7589, -73.9847], 12);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap, © CARTO',
        maxZoom: 19
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const day = days.find(d => d.id === activeDay);
      const bounds = [];

      day.items.forEach((item, idx) => {
        if (!item.latlng) return;
        const icon = L.divIcon({
          className: '',
          html: `<div class="map-marker ${item.star ? 'star' : ''}">${idx + 1}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
        const marker = L.marker(item.latlng, { icon }).addTo(markersLayer);
        marker.bindPopup(`<strong>${item.title}</strong><br><small>${item.time}</small>`);
        bounds.push(item.latlng);
      });

      // 경로 라인
      if (bounds.length > 1) {
        L.polyline(bounds, {
          color: '#5757f8',
          weight: 2,
          opacity: 0.4,
          dashArray: '6, 6'
        }).addTo(markersLayer);
      }

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    function focusMarker(idx) {
      const day = days.find(d => d.id === activeDay);
      const item = day.items[idx];
      if (item && item.latlng) {
        map.setView(item.latlng, 15, { animate: true });
      }
    }

    function render() {
      renderTabs();
      renderSchedule();
      renderMarkers();
    }

    initMap();
    render();
  </script>
</body>
</html>
