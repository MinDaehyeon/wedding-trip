<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC Honeymoon Itinerary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Montserrat:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --color-midnight-ink: #202020;
      --color-cloud-canvas: #f5f5f5;
      --color-paper-white: #ffffff;
      --color-muted-ash: #333333;
      --color-ghost-border: #ececec;
      --color-electric-violet: #5757f8;

      --font-display: 'Montserrat', 'Noto Sans KR', sans-serif;
      --font-body: 'Inter', 'Noto Sans KR', sans-serif;

      --radius-default: 8px;
      --radius-pill: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-cloud-canvas);
      color: var(--color-midnight-ink);
      line-height: 1.4;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .header {
      margin-bottom: 32px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 48px;
      line-height: 0.97;
      letter-spacing: -0.96px;
      color: var(--color-midnight-ink);
    }
    .header p {
      margin-top: 12px;
      font-size: 16px;
      color: var(--color-muted-ash);
    }

    .day-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .day-tab {
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      background: var(--color-paper-white);
      color: var(--color-midnight-ink);
      border: 1px solid var(--color-ghost-border);
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .day-tab:hover {
      border-color: var(--color-electric-violet);
    }
    .day-tab.active {
      background: var(--color-electric-violet);
      color: var(--color-paper-white);
      border-color: var(--color-electric-violet);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
      align-items: start;
    }

    .schedule {
      background: var(--color-paper-white);
      border-radius: var(--radius-default);
      padding: 24px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
    }

    /* ─── 모바일 (≤ 768px) ─── */
    @media (max-width: 768px) {
      .container { padding: 16px 12px; }
      .header { margin-bottom: 16px; }
      .header h1 { font-size: 32px; letter-spacing: -0.5px; }
      .header p { font-size: 13px; margin-top: 6px; }

      .day-tabs {
        margin-bottom: 16px;
        position: sticky;
        top: 0;
        background: var(--color-cloud-canvas);
        padding: 8px 0;
        z-index: 10;
      }
      .day-tab { padding: 6px 14px; font-size: 13px; }

      .layout {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .map-container {
        position: sticky;
        top: 56px;
        padding: 8px;
      }
      #map {
        height: 38vh;
        min-height: 280px;
      }

      .schedule {
        padding: 16px;
        max-height: none;
        overflow-y: visible;
      }
      .schedule-day-title { font-size: 22px; }
      .schedule-item {
        grid-template-columns: 56px 1fr;
        gap: 12px;
        padding: 12px 0;
      }
      .schedule-item:hover {
        margin: 0;
        padding: 12px 0;
        border-radius: 0;
        background: transparent;
      }
      .schedule-item.highlight {
        margin: 0 -8px;
        padding: 12px 8px;
      }
      .schedule-content .title { font-size: 14px; }
      .schedule-content .desc { font-size: 12px; }
      .legend { font-size: 11px; gap: 12px; }
    }
    .schedule-day-title {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 26px;
      letter-spacing: -0.52px;
      margin-bottom: 4px;
    }
    .schedule-day-sub {
      font-size: 14px;
      color: var(--color-muted-ash);
      margin-bottom: 20px;
    }

    .schedule-item {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-ghost-border);
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .schedule-item:last-child { border-bottom: none; }
    .schedule-item:hover {
      background: var(--color-cloud-canvas);
      margin: 0 -12px;
      padding: 14px 12px;
      border-radius: var(--radius-default);
      border-bottom-color: transparent;
    }
    .schedule-item.highlight {
      background: rgba(87, 87, 248, 0.06);
      margin: 0 -12px;
      padding: 14px 12px;
      border-radius: var(--radius-default);
      border-bottom-color: transparent;
    }

    .schedule-time {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 14px;
      color: var(--color-electric-violet);
      letter-spacing: -0.2px;
    }
    .schedule-content .title {
      font-weight: 700;
      font-size: 15px;
      color: var(--color-midnight-ink);
      margin-bottom: 4px;
    }
    .schedule-content .desc {
      font-size: 13px;
      color: var(--color-muted-ash);
      line-height: 1.45;
    }
    .schedule-content .tag {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--color-midnight-ink);
      color: var(--color-paper-white);
      font-size: 11px;
      font-weight: 500;
    }
    .schedule-content .tag.booked {
      background: var(--color-electric-violet);
    }
    .schedule-content .nearby {
      margin-top: 6px;
      padding: 6px 10px;
      background: var(--color-cloud-canvas);
      border-radius: 6px;
      font-size: 11.5px;
      color: var(--color-muted-ash);
      font-style: italic;
      line-height: 1.4;
    }
    .schedule-content .nearby::before {
      content: '⏱ 시간되면 ';
      font-style: normal;
      font-weight: 600;
      color: var(--color-electric-violet);
    }

    .map-container {
      background: var(--color-paper-white);
      border-radius: var(--radius-default);
      padding: 16px;
      position: sticky;
      top: 20px;
    }
    #map {
      width: 100%;
      height: calc(100vh - 240px);
      min-height: 500px;
      border-radius: var(--radius-default);
      z-index: 0;
    }

    .legend {
      margin-top: 12px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--color-muted-ash);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* custom map marker */
    .map-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-electric-violet);
      color: var(--color-paper-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      border: 2px solid var(--color-paper-white);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .map-marker.star {
      background: var(--color-midnight-ink);
    }

    .scrollbar::-webkit-scrollbar { width: 6px; }
    .scrollbar::-webkit-scrollbar-track { background: transparent; }
    .scrollbar::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 3px;
    }
  </style>
</head>

    // ── 렌더링 ──────────────────────────
    const tabsEl = document.getElementById('dayTabs');
    const scheduleEl = document.getElementById('schedule');
    let activeDay = 'd14';
    let map, markersLayer;

    function renderTabs() {
      tabsEl.innerHTML = '';
      days.forEach(d => {
        const btn = document.createElement('button');
        btn.className = 'day-tab' + (d.id === activeDay ? ' active' : '');
        btn.textContent = d.label;
        btn.onclick = () => { activeDay = d.id; render(); };
        tabsEl.appendChild(btn);
      });
    }

    function renderSchedule() {
      const day = days.find(d => d.id === activeDay);
      scheduleEl.innerHTML = `
        <div class="schedule-day-title">${day.title}</div>
        <div class="schedule-day-sub">${day.label} · ${day.sub}</div>
      `;
      day.items.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'schedule-item' + (item.star ? ' highlight' : '');
        div.innerHTML = `
          <div class="schedule-time">${item.time}</div>
          <div class="schedule-content">
            <div class="title">${item.title}</div>
            <div class="desc">${item.desc}</div>
            ${item.booked ? `<span class="tag ${item.booked.includes('✅') ? 'booked' : ''}">${item.booked}</span>` : ''}
            ${item.nearby ? `<div class="nearby">${item.nearby}</div>` : ''}
          </div>
        `;
        div.onclick = () => focusMarker(idx);
        scheduleEl.appendChild(div);
      });
    }

    function initMap() {
      map = L.map('map').setView([40.7589, -73.9847], 12);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap, © CARTO',
        maxZoom: 19
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const day = days.find(d => d.id === activeDay);
      const bounds = [];

      day.items.forEach((item, idx) => {
        if (!item.latlng) return;
        const icon = L.divIcon({
          className: '',
          html: `<div class="map-marker ${item.star ? 'star' : ''}">${idx + 1}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
        const marker = L.marker(item.latlng, { icon }).addTo(markersLayer);
        marker.bindPopup(`<strong>${item.title}</strong><br><small>${item.time}</small>`);
        bounds.push(item.latlng);
      });

      // 경로 라인
      if (bounds.length > 1) {
        L.polyline(bounds, {
          color: '#5757f8',
          weight: 2,
          opacity: 0.4,
          dashArray: '6, 6'
        }).addTo(markersLayer);
      }

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    function focusMarker(idx) {
      const day = days.find(d => d.id === activeDay);
      const item = day.items[idx];
      if (item && item.latlng) {
        map.setView(item.latlng, 15, { animate: true });
      }
    }

    function render() {
      renderTabs();
      renderSchedule();
      renderMarkers();
    }

    initMap();
    render();
  </script>
